AWSTemplateFormatVersion: '2010-09-09'
Description: 'EC2 Instance with Web Server, SSM Role, and Elastic IP'

Resources:
  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-06ee6255945a96aba  # Amazon Linux 2 AMI ID for eu-central-1
      SubnetId: !ImportValue MySubnetId
      SecurityGroupIds: 
        - !ImportValue MySecurityGroupId
      IamInstanceProfile: !Ref MyEC2InstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Hello World!</h1>" > /var/www/html/index.html
      Tags:
        - Key: Name
          Value: MyWebServer
  
  MyEC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles: 
        - !Ref MySSMRole

  MySSMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Path: "/"

  MyElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref MyEC2Instance

Outputs:
  InstanceId:
    Description: ID of the EC2 instance
    Value: !Ref MyEC2Instance
  ElasticIP:
    Description: Elastic IP associated with the instance
    Value: !Ref MyElasticIP