<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de configuration</title>
</head>
<body>
    <form id="configForm">
        <label for="instance_type">Type d'instance :</label>
        <input type="text" id="instance_type" name="instance_type" required><br><br>

        <label for="region">Région :</label>
        <input type="text" id="region" name="region" required><br><br>

        <label for="subnet_id">ID du sous-réseau :</label>
        <input type="text" id="subnet_id" name="subnet_id" required><br><br>

        <label for="name_tag">Nom du serveur :</label>
        <input type="text" id="name_tag" name="name_tag" required><br><br>

        <label>
            <input type="checkbox" id="destroy_resources" name="destroy_resources">
            Détruire les ressources précédentes ?
        </label><br><br>

        <button type="submit">Envoyer</button>
    </form>

    <script>
        document.getElementById('configForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const destroyResources = document.getElementById('destroy_resources').checked;
            const url = destroyResources 
                ? 'https://01fajjyqw1.execute-api.eu-west-1.amazonaws.com/ver2/destroy'
                : 'https://01fajjyqw1.execute-api.eu-west-1.amazonaws.com/ver2/create';

            const formData = {
                instance_type: document.getElementById('instance_type').value,
                region: document.getElementById('region').value,
                subnet_id: document.getElementById('subnet_id').value,
                name_tag: document.getElementById('name_tag').value
            };

            console.log("Données du formulaire:", formData);
            console.log("Détruire les ressources:", destroyResources);

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                console.log('Succès:', data);
                alert(destroyResources ? 'Ressources détruites avec succès !' : 'Données envoyées avec succès !');
            })
            .catch((error) => {
                console.error('Erreur:', error);
                alert('Erreur lors de l\'opération.');
            });
        });
    </script>
</body>
</html>
