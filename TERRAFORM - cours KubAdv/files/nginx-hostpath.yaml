apiVersion: v1
kind: Pod
metadata:
  name: nginx-hostpath
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: nginx-logs
      mountPath: /var/log/nginx
  - name: log-reader
    image: busybox
    command: ['sh', '-c', 'echo "Derniers logs du container nginx:" && tail -f /nginx-logs/access.log']
    volumeMounts:
    - name: nginx-logs
      mountPath: /nginx-logs
  volumes:
  - name: nginx-logs
    hostPath: 
      path: /log/webapp
      type: DirectoryOrCreate
